<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta name="description" content="Vokabula – Vokabeln lernen mit deinen eigenen Wortlisten." />

    <!-- Als App vom Homebildschirm starten (ohne Safari-Leisten) -->
    <link rel="manifest" href="/vokabula/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Vokabula" />
    <meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111917" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/vokabula/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/vokabula/icon-192.png" />

    <style id="expo-reset">
      html {
        height: 100%;
        background-color: #eef1ec;
      }
      body {
        margin: 0;
        /* etwas höher als der Bildschirm: die Seite ist (wie bei der Latein-App) scrollbar,
           iOS gibt dann die volle Fensterhöhe */
        min-height: calc(100% + 120px);
        background-color: #eef1ec;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #111917;
        }
      }
      #root {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--app-h, auto);
        overflow: hidden;
      }
    </style>
    <script>
      // iOS meldet in der Home-Bildschirm-App teils eine um die Statusleiste zu kleine Fensterhöhe.
      // --gap = fehlende Höhe (px), damit die Tab-Leiste den Rest ausgleichen kann.
      (function () {
        var root = document.documentElement;
        function set() {
          try {
            var standalone = window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            var portrait = window.innerHeight >= window.innerWidth;
            var full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
            var diff = full - window.innerHeight;
            // Neuinstallationen melden die Höhe korrekt: keine Korrektur mehr (sonst ragt die Tab-Leiste unten heraus)
            root.style.setProperty('--gap', '0px');
            // Im Home-Bildschirm immer die volle Bildschirmhöhe nutzen, egal welche Höhe iOS gerade meldet
            root.style.setProperty('--app-h', 'auto');
          } catch (e) {}
        }
        set();
        window.addEventListener('resize', set);
        window.addEventListener('orientationchange', function () { setTimeout(set, 250); });
      })();
    </script>
  </head>

  <body>
    <noscript>Vokabula braucht JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
